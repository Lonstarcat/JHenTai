[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emangato"
version = "0.6.0"
description = "A safety-first Windows manga library maintenance application"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "openpyxl>=3.1,<4",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
