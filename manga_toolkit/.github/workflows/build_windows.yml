name: Build Emangato Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: emangato-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean Emangato.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Emangato_Windows
          path: dist/Emangato/**
          if-no-files-found: error
          retention-days: 14
