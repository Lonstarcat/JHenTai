name: Build Android and macOS Release

on:
  push:
    branches:
      - feature/enhanced
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  android-arm64:
    name: Android arm64 Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true

      - name: Restore Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          printf '%s' "$KEY_PROPERTIES" > android/key.properties

      - run: flutter pub get

      - name: Build arm64 Release APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi
          -t lib/src/main.dart
          --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: JHenTai-Android-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  macos:
    name: macOS Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true

      - run: flutter pub get

      - name: Build DMG
        run: sh dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: JHenTai-macOS-release
          path: "*.dmg"
          retention-days: 7