name: Build Windows Release

on:
  push:
    branches:
      - feature/enhanced
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $Version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ($Version -notmatch '^\d+\.\d+\.\d+\+\d+$') {
            throw 'Unable to read version from pubspec.yaml'
          }
          "value=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - run: flutter pub get

      - name: Build Windows x64 Release
        shell: pwsh
        run: |
          flutter build windows --release -t lib/src/main.dart --no-pub

          $Destination = 'build\windows\release-package'
          $Source = 'build\windows\x64\runner\Release'

          New-Item -Path $Destination -ItemType Directory -Force | Out-Null
          Copy-Item "$Source\*" -Destination $Destination -Recurse -Force
          Get-ChildItem -Path 'windows' -Filter '*.dll' | Copy-Item -Destination $Destination -Force

          if (-not (Get-ChildItem -Path $Destination -Filter '*.exe')) {
            throw "Windows executable was not copied to: $Destination"
          }

      - uses: actions/upload-artifact@v4
        with:
          # GitHub packages the directory into this single ZIP automatically.
          # Uploading a pre-compressed ZIP here would create a nested archive.
          name: JHenTai_${{ steps.version.outputs.value }}e_Windows
          path: build/windows/release-package/**
          if-no-files-found: error
          retention-days: 7
